<title>Fóscolo & Company</title>

<meta name="description" content="Fóscolo & Company Edições é um selo editorial independente dedicado à publicação e preservação de obras de história, ensaio, literatura e pesquisa.">

<link rel="icon" href="favicon.png">
<link rel="canonical" href="https://www.foscolo.com.br/">

<style>
:root{
--preto:#111111;
--marfim:#F5F2EB;
--branco:#FFFDF8;
--dourado:#D9A441;
--cinza:#7A7A7A;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,"Times New Roman",serif;
background:var(--marfim);
color:var(--preto);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:32px;
line-height:1.7;
}

main{
max-width:720px;
}

img{
width:260px;
max-width:80%;
margin-bottom:32px;
}

h1{
font-size:2.6rem;
line-height:1.1;
margin-bottom:18px;
}

p{
color:#433c35;
font-size:1.1rem;
margin-bottom:26px;
}

.languages{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-size:.85rem;
letter-spacing:.08em;
text-transform:uppercase;
margin-top:26px;
}

.languages a{
color:#555;
text-decoration:none;
transition:.2s;
}

.languages a:hover{
color:var(--dourado);
}

.languages strong{
color:var(--preto);
}

.btn{
display:inline-block;
padding:13px 24px;
border-radius:999px;
background:var(--preto);
color:var(--marfim);
border:1px solid var(--preto);
text-decoration:none;
transition:.2s;
}

.btn:hover{
border-color:var(--dourado);
transform:translateY(-2px);
}

@media(max-width:700px){
h1{
font-size:2rem;
}

.languages{
font-size:.76rem;
flex-wrap:wrap;
}
}
</style>

</head>

<body>

<main>

<img src="logo-horizontal.png" alt="Fóscolo & Company">

<h1>Ideias acendem.<br>Histórias permanecem.</h1>

<p>
